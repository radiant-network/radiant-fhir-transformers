[project]
name = "radiant_fhir_transform_cli"
version = "0.0.1"
authors = [
  { name="Charles Haynes", email="haynescd@chop.edu" },
  { name="Natasha Singh", email="singhn4@chop.edu" },
]
description = "CLI transforming FHIR ndjson into flat CSV"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache License",
    "Operating System :: Linux",
]
dependencies = [
  "click>=8.1,<9",
  "sqlonfhir>=0.0.2,<0.1",
]

[dependency-groups]
dev = [
  "pytest==8.3.3",
  "pytest-mock==3.14.0",
  "faker==36.1.1",
  "pandas>=2.2,<3",
  "ruff==0.16.0",
  "pyrefly==1.1.1",
]

[project.scripts]
radiant = "radiant_fhir_transform_cli.cli:main"

[project.urls]
Homepage = "https://github.com/radiant-network/radiant-fhir-transformers"
Issues = "https://github.com/radiant-network/radiant-fhir-transformers/issues"

[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
exclude = ["data"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# imports in __init__.py are deliberate re-exports (transformer/test-helper registries)
"__init__.py" = ["F401"]

[tool.pyrefly]
project-includes = ["radiant_fhir_transform_cli", "tests"]
